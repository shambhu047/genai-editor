version: "3.9"

services:
  db:
    image: postgres:15
    container_name: genai-editor-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - genai-editor-network

  nats:
    image: nats:latest
    container_name: genai-editor-nats
    restart: always
    command: [ "-c", "/etc/nats/nats.conf" ]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      - "4223:4223"
      - "8222:8222"
    networks:
      - genai-editor-network

  app:
    build: .
    container_name: genai-editor-app
    restart: always
    depends_on:
      - db
      - nats
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_SERVER: "nats://nats:4222"
      NATS_WS_SERVER: "ws://nats:8080"
      NATS_MGMT_SERVER: "http://nats:8222"
    ports:
      - "8000:8000"
    networks:
      - genai-editor-network

volumes:
  pgdata:

networks:
  genai-editor-network:
    driver: bridge
